version: "3.8"

services:
  backend:
    build: ./backend
    container_name: task-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://db:27017/taskdb
      - PORT=5000
    depends_on:
      - db

  db:
    image: mongo
    container_name: task-mongo
    ports:
      - "27017:27017"
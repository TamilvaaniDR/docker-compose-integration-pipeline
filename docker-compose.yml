version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/taskdb

  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    # ❌ NO PORTS HERE (important)

  test:
    build: ./tests
    command: npm test
    depends_on:
      - backend
      - mongo

volumes:
  mongo-data: